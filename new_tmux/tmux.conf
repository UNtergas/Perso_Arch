# ~/.tmux.conf  (repo copy: Perso_Arch/new_tmux/tmux.conf)
# Alt-Space, not C-Space: Ctrl+Space and Ctrl+` both send NUL, and nvim uses Ctrl+` to toggle its terminal
set -g prefix M-Space
unbind C-b
unbind C-Space
bind M-Space send-prefix

set -g mouse on
set -g escape-time 0              # no Esc lag in nvim
set -g focus-events on            # nvim autoread / FocusGained
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"   # truecolor for the nvim theme
setw -g mode-keys vi

bind r source-file ~/.tmux.conf \; display "reloaded"

# move: prefix + hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# resize: prefix + HJKL (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# prefix + arrows: MOVE the pane (swap places with the neighbour in that direction), focus goes with it
bind -r Left  swap-pane -t '{left-of}'  \; select-pane -t '{left-of}'
bind -r Right swap-pane -t '{right-of}' \; select-pane -t '{right-of}'
bind -r Up    swap-pane -t '{up-of}'    \; select-pane -t '{up-of}'
bind -r Down  swap-pane -t '{down-of}'  \; select-pane -t '{down-of}'

# prefix + [ / ]: like niri's consume-or-expel-window-left / right (Mod+[ and Mod+])
#   pane alone in its column -> consumed into the neighbouring column (stacked below its pane)
#   pane in a stack          -> expelled into its own full-height column at the left / right edge
# Other columns keep their widths. Logic is in ~/.tmux/pane-col.sh (copy of new_tmux/pane-col.sh).
# col1 | col2, [ on col2 -> col1 over col2, [ again -> col2 | col1.  Copy mode moved to v for this.
bind v copy-mode
# copy mode like vim: v starts the selection (V line, C-v block), y yanks to the system clipboard and leaves, Esc leaves
# (wl-copy on Wayland, xclip on X11)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -selection clipboard"
bind -T copy-mode-vi Escape send -X cancel
bind [ run-shell "~/.tmux/pane-col.sh left #{pane_id}"
bind ] run-shell "~/.tmux/pane-col.sh right #{pane_id}"

# splits like nvim: \ = side by side, - = stacked (new pane keeps cwd)
bind \\ split-window -h -c "#{pane_current_path}"
bind -   split-window -v -c "#{pane_current_path}"
bind x kill-pane

# detach moved to Q so lowercase d can be the preset
bind Q detach-client

# PRESET: prefix + d -> new window, nvim 65% | 2 terminals stacked 35%
bind d new-window -n dev -c "#{pane_current_path}" nvim \; \
       split-window -h -l 35% -c "#{pane_current_path}" \; \
       split-window -v -c "#{pane_current_path}" \; \
       select-pane -L

# PRESET (kotlin): prefix + a -> same layout, but kvim in the left pane
bind a new-window -n kdev -c "#{pane_current_path}" "NVIM_APPNAME=kvim nvim" \; \
       split-window -h -l 35% -c "#{pane_current_path}" \; \
       split-window -v -c "#{pane_current_path}" \; \
       select-pane -L

# prefix + Space: flip columns <-> rows. Works for 2 panes and for the preset (main pane 65%):
#   main-vertical   = main pane left, the others stacked on the right
#   main-horizontal = main pane on top, the others side by side below
set -g main-pane-width 65%
set -g main-pane-height 65%
# (the regex has no commas or braces on purpose: tmux formats split on commas; it matches a top-level [ = rows)
bind Space if -F '#{m/r:^[0-9a-f][0-9a-f][0-9a-f][0-9a-f].[0-9]+x[0-9]+.[0-9]+.[0-9]+\[,#{window_layout}}' \
  'select-layout main-vertical' \
  'select-layout main-horizontal'

# prefix + m: focus mode. The focused pane goes to the big 65% slot on the left, all the others
# stack on the right (35%). Press again to put every pane back where it was (layout + positions).
# If the pane count changed in between, the saved layout is stale, so it just applies focus mode again.
bind m if -F '#{&&:#{@main_saved},#{==:#{@main_n},#{window_panes}}}' \
  'run-shell "tmux swap-pane -d -s :.1 -t :.#{@main_idx} ; tmux select-layout \"#{@main_saved}\" ; tmux set -wu @main_saved"' \
  'run-shell "tmux set -w @main_saved \"#{window_layout}\" ; tmux set -w @main_n #{window_panes} ; tmux set -w @main_idx #{pane_index} ; tmux swap-pane -d -s #{pane_id} -t :.1 ; tmux select-layout main-vertical"'

# zoom the pane to the whole window and back (layout restored exactly)
bind z resize-pane -Z

# o / p = previous / next window, n = new window
bind o previous-window
bind p next-window
bind n new-window -c "#{pane_current_path}"
unbind Z

# grow the current pane to fill its COLUMN, press again to restore the old split
bind c if -F '#{@saved_h}' \
  'run-shell "tmux resize-pane -t #{pane_id} -y #{@saved_h} ; tmux set -p -t #{pane_id} -u @saved_h"' \
  'run-shell "tmux set -p -t #{pane_id} @saved_h #{pane_height} ; tmux resize-pane -t #{pane_id} -y 95%"'

# --- statusline: mirrors the nvim lualine (koda-glade): light teal-grey fade, powerline arrows, no plugin needed.
# Section a (session) changes colour like lualine's mode: grey = normal, yellow = prefix pressed, blue = copy mode.
# Colours: a #8da1a1, b #adbcbc, c #cbd6d6, text #14201f; yellow #ecd98f/#4a3800, blue #b8d0f0/#1a2f55
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#cbd6d6,fg=#14201f"
set -g status-left-length 60
set -g status-right-length 230

# left: session (a, mode coloured) > running prefix/zoom label
set -g status-left "#[fg=#{?client_prefix,#4a3800,#{?pane_in_mode,#1a2f55,#14201f}},bg=#{?client_prefix,#ecd98f,#{?pane_in_mode,#b8d0f0,#8da1a1}},bold] #S #[fg=#{?client_prefix,#ecd98f,#{?pane_in_mode,#b8d0f0,#8da1a1}},bg=#adbcbc]#[fg=#1c2828,bg=#adbcbc,nobold] #{?client_prefix,PREFIX,#{?pane_in_mode,COPY,#{?window_zoomed_flag,ZOOM,NORMAL}}} #[fg=#adbcbc,bg=#cbd6d6] "

# windows: inactive plain, current = a-coloured block with a zoom marker
set -g window-status-separator ""
set -g window-status-format "#[fg=#4a5a5a,bg=#cbd6d6] #I #W#{?window_zoomed_flag, Z,} "
set -g window-status-current-format "#[fg=#8da1a1,bg=#cbd6d6]#[fg=#14201f,bg=#8da1a1,bold] #I #W#{?window_zoomed_flag, Z,} #[fg=#8da1a1,bg=#cbd6d6,nobold]"

# right (fades c > b > a like lualine): git branch | pane n/total + time | what the pane is running (nvim, zsh, ...)
set -g @right "#[fg=#14201f,bg=#cbd6d6] #(git -C '#{pane_current_path}' branch --show-current 2>/dev/null) #[fg=#b8c7c7,bg=#cbd6d6]#[fg=#1c2828,bg=#b8c7c7]  #P/#{window_panes} #[fg=#a3b5b5,bg=#b8c7c7]#[fg=#1c2828,bg=#a3b5b5] %d %b %H:%M #[fg=#8da1a1,bg=#a3b5b5]#[fg=#14201f,bg=#8da1a1,bold] #{pane_current_command} "
# which-key style hint: while the prefix is pressed the right side lists the keys, then goes back to normal
set -g @hint "#[fg=#4a3800,bg=#ecd98f,bold] d nvim | a kvim | hjkl focus | arrows move pane | HJKL size | \\ vsplit | - hsplit | Space cols/rows | m focus 65% | z zoom | c column | n new | o/p win | w list | v copy | [ ] consume/expel | & close win | x close pane | Q detach | r reload "
set -g status-right "#{?client_prefix,#{E:@hint},#{E:@right}}"

# pane borders + copy-mode selection + messages
set -g pane-border-style "fg=#adbcbc"
set -g pane-active-border-style "fg=#8da1a1,bold"
set -g mode-style "bg=#b8d0f0,fg=#1a2f55"
set -g message-style "bg=#b8d0f0,fg=#1a2f55"
set -g message-command-style "bg=#b8d0f0,fg=#1a2f55"
