# ~/.tmux.conf  (repo copy: Perso_Arch/new_tmux/tmux.conf)
# Alt-e: unused by nvim, kvim, zsh, Alacritty and niri. Not Alt-k (nvim half page up), not C-Space (also sent by Ctrl+`)
# Alt-e opens a key dropdown under the status bar (~/.tmux/which-key.sh, copy of new_tmux/which-key.sh). It reads one
# key and passes it to the prefix table, so every "prefix + key" below is Alt-e then the key. The real tmux prefix is
# off (None) so that Alt-e is an ordinary key that can open the dropdown.
set -g prefix None
unbind C-b
unbind C-Space
unbind M-Space
# The popup is 36 rows; -h does not take a format, so a short terminal (under 40 rows) gets a 90% popup instead.
bind -n M-e if -F '#{e|<:#{client_height},40}' {
  display-popup -E -b rounded -x "#{e|-:#{client_width},62}" -y S -w 60 -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" -h 90% "~/.tmux/which-key.sh '#{client_name}' '#{pane_id}'"
} {
  display-popup -E -b rounded -x "#{e|-:#{client_width},62}" -y S -w 60 -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" -h 36 "~/.tmux/which-key.sh '#{client_name}' '#{pane_id}'"
}

set -g mouse on
set -g escape-time 0              # no Esc lag in nvim
set -g focus-events on            # nvim autoread / FocusGained
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"   # truecolor for the nvim theme
set -as terminal-features ',alacritty*:usstyle'   # coloured underlines (nvim scope underline in the guide colour); without it tmux draws them in the text colour
setw -g mode-keys vi
setw -g copy-mode-line-numbers relative

bind R source-file ~/.tmux.conf \; display "reloaded"

# move: prefix + hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# resize: prefix + HJKL (repeatable). One step is 10% of the window (width for H / L, height for J / K), so from an even split
# the sizes land on 50, 40, 30, 20 %. Same steps as C-k h/j/k/l in nvim.
bind -r H run-shell "tmux resize-pane -t #{pane_id} -L $(( #{window_width} / 10 ))"
bind -r J run-shell "tmux resize-pane -t #{pane_id} -D $(( #{window_height} / 10 ))"
bind -r K run-shell "tmux resize-pane -t #{pane_id} -U $(( #{window_height} / 10 ))"
bind -r L run-shell "tmux resize-pane -t #{pane_id} -R $(( #{window_width} / 10 ))"
# prefix + =: equal sizes for the whole window, at every level of the layout: one big pane on the left and two on the right
# becomes left 50% | right column 50%, with the two right panes 50% of the height each. No toggle back. The work is done by
# ~/.tmux/equalize.sh (copy of new_tmux/equalize.sh), because select-layout -E ignores a neighbour that is itself a split.
bind = run-shell "~/.tmux/equalize.sh #{pane_id} ; ~/.tmux/expand.py clear #{window_id}"

# prefix + r: resize mode, like i3. h / j / k / l resize the active pane in 10% steps (same as H J K L), = equal sizes, and
# Esc / Enter / q leave. Any other key leaves too (tmux drops a key that is not in the table). Every binding returns to the
# resize table, so the mode stays on until you leave it. The status label shows RESIZE while it is on.
bind r switch-client -T resize \; refresh-client -S
bind -T resize h run-shell "tmux resize-pane -t #{pane_id} -L $(( #{window_width} / 10 ))" \; switch-client -T resize
bind -T resize j run-shell "tmux resize-pane -t #{pane_id} -D $(( #{window_height} / 10 ))" \; switch-client -T resize
bind -T resize k run-shell "tmux resize-pane -t #{pane_id} -U $(( #{window_height} / 10 ))" \; switch-client -T resize
bind -T resize l run-shell "tmux resize-pane -t #{pane_id} -R $(( #{window_width} / 10 ))" \; switch-client -T resize
bind -T resize = run-shell "~/.tmux/equalize.sh #{pane_id} ; ~/.tmux/expand.py clear #{window_id}" \; switch-client -T resize
bind -T resize Escape switch-client -T root \; refresh-client -S
bind -T resize Enter switch-client -T root \; refresh-client -S
bind -T resize q switch-client -T root \; refresh-client -S

# prefix + 1..9 jumps to the PANE with that number (the numbers prefix + q shows); prefix + e then 1..9 jumps to the WINDOW (a small
# dialog like N and &, dialog.sh window-number: Alt-e, e, 3).
bind 1 select-pane -t :.1
bind 2 select-pane -t :.2
bind 3 select-pane -t :.3
bind 4 select-pane -t :.4
bind 5 select-pane -t :.5
bind 6 select-pane -t :.6
bind 7 select-pane -t :.7
bind 8 select-pane -t :.8
bind 9 select-pane -t :.9
bind e display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " go to window " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh window-number '#{session_id}'"

# prefix + arrows: MOVE the pane (swap places with the neighbour in that direction), focus goes with it
bind -r Left swap-pane -t '{left-of}'  \; select-pane -t '{left-of}'
bind -r Right swap-pane -t '{right-of}' \; select-pane -t '{right-of}'
bind -r Up swap-pane -t '{up-of}'    \; select-pane -t '{up-of}'
bind -r Down swap-pane -t '{down-of}'  \; select-pane -t '{down-of}'

# prefix + [ / ]: like niri's consume-or-expel-window-left / right (Mod+[ and Mod+])
#   pane alone in its column -> consumed into the neighbouring column (stacked below its pane)
#   pane in a stack          -> expelled into its own full-height column at the left / right edge
# Other columns keep their widths. Logic is in ~/.tmux/pane-col.sh (copy of new_tmux/pane-col.sh).
# col1 | col2, [ on col2 -> col1 over col2, [ again -> col2 | col1.  Copy mode moved to v for this.
bind v copy-mode
# copy mode like vim: v starts the selection (V line, C-v block), y yanks to the system clipboard and leaves, Esc leaves
# (wl-copy on Wayland, xclip on X11)
bind -T copy-mode-vi v send -X begin-selection
# iw: select the whole word under the cursor, wherever in the word it is (vim's viw / iw; tmux has no text objects, so i opens a
# one-key table for w). Works from v (selection already started) or directly.
bind -T copy-mode-vi i switch-client -T copy-mode-iw
bind -T copy-mode-iw w send -X select-word
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -selection clipboard"
bind -T copy-mode-vi Escape send -X cancel
# Hold either bracket to scroll using terminal key repeat (copy mode only).
bind -T copy-mode-vi [ send -X scroll-down
bind -T copy-mode-vi ] send -X scroll-up
bind [ run-shell "~/.tmux/pane-col.sh left #{pane_id}"
bind ] run-shell "~/.tmux/pane-col.sh right #{pane_id}"

# splits like nvim: \ = side by side, - = stacked (new pane keeps cwd)
bind \\ split-window -h -c "#{pane_current_path}"
bind -   split-window -v -c "#{pane_current_path}"

# s / S: a popup (like the other dialogs) asks for N = 1..9, and this pane takes N x 10% of its column's height (s, like c) / of its
# row's width (S, like C). Any other key cancels. The session picker that was on s is on d now.
bind s display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " column height " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh size-col '#{pane_id}'"
bind S display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " row width " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh size-row '#{pane_id}'"
bind d choose-tree -Zs

# detach moved to Q so lowercase d can be the preset
bind Q detach-client

# PRESETS: prefix + a opens a small "layout" dialog (dialog.sh preset); press 1 or 2:
#   1 -> 3 terminals: one 65% on the left, 2 stacked on the right (35%)
#   2 -> 3 terminals: one on top (70% of the height), 2 side by side below (30%)
# With a single pane in the window the preset turns THIS window into the layout (the pane stays, 2 more are added);
# with more than one pane it opens a new window with the layout instead (a window you arranged is not touched).
# Any other key closes the dialog. (Detach is Q; tmux's default d = detach is replaced by the session picker below.)
bind a {
  set -gu @preset
  display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " layout " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh preset"
  if -F '#{==:#{@preset},1}' {
    if -F '#{==:#{E:@tiled},1}' {
      split-window -h -l 35% -c "#{pane_current_path}"
      split-window -v -c "#{pane_current_path}"
      select-pane -L
    } {
      set -gu @wok
      display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " new window " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/ask-name.sh side"
      if -F "#{@wok}" {
        new-window -c "#{pane_current_path}"
        if -F "#{@wname}" { rename-window "#{@wname}" }
        split-window -h -l 35% -c "#{pane_current_path}"
        split-window -v -c "#{pane_current_path}"
        select-pane -L
      }
    }
  }
  if -F '#{==:#{@preset},2}' {
    if -F '#{==:#{E:@tiled},1}' {
      split-window -v -l 30% -c "#{pane_current_path}"
      split-window -h -c "#{pane_current_path}"
      select-pane -U
    } {
      set -gu @wok
      display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " new window " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/ask-name.sh stacked"
      if -F "#{@wok}" {
        new-window -c "#{pane_current_path}"
        if -F "#{@wname}" { rename-window "#{@wname}" }
        split-window -v -l 30% -c "#{pane_current_path}"
        split-window -h -c "#{pane_current_path}"
        select-pane -U
      }
    }
  }
}

# Space is unbound (no flip, no stock layout cycling). main-pane-width is the big slot of m (focus left) and of the
# Alt-4 layout, main-pane-height the big slot of n (focus top) and of the Alt-3 layout
set -g main-pane-width 65%
set -g main-pane-height 70%
unbind Space

# prefix + m: focus mode. The focused pane goes to the big 65% slot on the left, all the others stack on the right (35%).
# One way only, no toggle back: use = (equal sizes) or move panes by hand. Only z, c and C toggle.
bind m run-shell "tmux swap-pane -d -s #{pane_id} -t :.1 ; tmux select-layout main-vertical"

# prefix + n: focus mode, top version. The focused pane goes to the top (70% of the height), all the others sit side by
# side below it (30%). One way only, like m.
bind n run-shell "tmux swap-pane -d -s #{pane_id} -t :.1 ; tmux select-layout main-horizontal"

# zoom the pane to the whole window and back (layout restored exactly)
bind z resize-pane -Z

# o / p = previous / next window, N = new window
bind o previous-window
bind p next-window
# new window: a floating name dialog (~/.tmux/ask-name.sh, fzf as a text box), centred in the upper part.
# Enter makes the window (empty name keeps the auto name), Esc cancels. a and d use the same dialog, prefilled.
bind N {
  set -gu @wok
  display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " new window " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/ask-name.sh ''"
  if -F "#{@wok}" {
    new-window -c "#{pane_current_path}"
    if -F "#{@wname}" { rename-window "#{@wname}" }
  }
}
unbind Z

# All common input/confirmation prompts use the same compact popup as N.
bind , display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " rename window " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh rename-window '#{window_id}'"
bind '$' display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " rename session " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh rename-session '#{session_id}'"
bind '&' display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " close window " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh kill-window '#{window_id}'"
bind x display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " close pane " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh kill-pane '#{pane_id}'"
bind D display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " close other panes " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh kill-other-panes '#{pane_id}'"
bind X display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " close session " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh kill-session '#{session_id}'"
# the tmux command line is taller: it lists the commands as you type (Tab completes), like the nvim command line
bind ':' display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 70% -h 16 -T " tmux command " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh command '#{pane_id}'"
# J: send this pane to another window (picker with search, or a new window) and follow it; K: pull a pane of another window into this one
bind J display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 60% -h 14 -T " move pane to window " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh move-pane '#{pane_id}'"
bind K display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 70% -h 14 -T " pull pane here " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh pull-pane '#{pane_id}'"
bind "'" display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " jump to window " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh jump-window '#{session_id}'"
bind '.' display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " move window " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh move-window '#{window_id}'"
bind f display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " find window " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh find-window '#{pane_id}'"

# c: grow the current pane to fill its COLUMN (full height); C: the same for the ROW (95% of the width). Press again on the
# same pane to restore. Lane based (~/.tmux/expand.py, copy of new_tmux/expand.py): the lane is the strip of panes the
# expansion squeezes, it remembers their sizes, and every pane in it shows COLUMN / ROW in the statusline. Expansions
# with disjoint lanes live side by side (a and b both COLUMN in a 2x2); a new one whose lane shares a pane with an
# existing one replaces it. = (equal sizes) forgets them all.
bind c run-shell "~/.tmux/expand.py toggle col #{pane_id}"
bind C run-shell "~/.tmux/expand.py toggle row #{pane_id}"


# No command prompts on the status line: the stock ones are small dialogs like N and & (dialog.sh), and show COMMAND in dark purple
# in the mode label. Pane title, copy-mode search / goto line / jump to a character / repeat count. (prefix + / describe-key is unbound.)
unbind /
bind T display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " pane title " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh pane-title"
bind -T copy-mode-vi / display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " search down " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh copy-search-down"
bind -T copy-mode-vi ? display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " search up " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh copy-search-up"
bind -T copy-mode-vi : display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " goto line " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh copy-goto-line"
bind -T copy-mode-vi f display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " jump forward " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh copy-jump-forward"
bind -T copy-mode-vi F display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " jump backward " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh copy-jump-backward"
bind -T copy-mode-vi t display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " jump to forward " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh copy-jump-to-forward"
bind -T copy-mode-vi T display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " jump to backward " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh copy-jump-to-backward"
bind -T copy-mode-vi 1 display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " repeat " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh copy-repeat 1"
bind -T copy-mode-vi 2 display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " repeat " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh copy-repeat 2"
bind -T copy-mode-vi 3 display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " repeat " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh copy-repeat 3"
bind -T copy-mode-vi 4 display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " repeat " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh copy-repeat 4"
bind -T copy-mode-vi 5 display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " repeat " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh copy-repeat 5"
bind -T copy-mode-vi 6 display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " repeat " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh copy-repeat 6"
bind -T copy-mode-vi 7 display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " repeat " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh copy-repeat 7"
bind -T copy-mode-vi 8 display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " repeat " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh copy-repeat 8"
bind -T copy-mode-vi 9 display-popup -E -b rounded -x C -y "#{e|+:#{e|/:#{e|*:#{client_height},2},5},2}" -w 50% -h 3 -T " repeat " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/dialog.sh copy-repeat 9"

# Flash jump in copy mode (like flash.nvim's s): Alt-e v, then s, type a character, press the label next to the match you want.
# A borderless popup is laid exactly over the pane (-x P -y P: bottom left of the pane) and ~/.tmux/flash.py (copy of
# new_tmux/flash.py) redraws the text in gray with the matches highlighted and labelled, then moves the copy-mode cursor.
# (display-popup does not expand formats in -w / -h, so the pane size goes through run-shell, which does)
bind -T copy-mode-vi s run-shell -b 'tmux display-popup -c "#{client_name}" -t "#{pane_id}" -E -B -x P -y P -w #{pane_width} -h #{pane_height} -s "fg=#8a8a8a" "python3 ~/.tmux/flash.py"'

# --- statusline: mirrors the nvim lualine (koda-glade): light teal-grey fade, powerline arrows, no plugin needed.
# The mode label (NORMAL / PREFIX / COPY / ZOOM) changes colour like lualine's mode: grey = normal,
# yellow = prefix pressed, blue = copy mode, lilac = a pane is zoomed. The session name is on the far right (see @right).
# The date / time block on the right has the colour of the mode label (dialog dark purple COMMAND, resize peach, prefix yellow,
# copy blue, zoom lilac, else grey).
# Colours (DMS dark blue): a #4b8cd8, b #3c4252, c #2d323d, bar #20242c, text #d3dae3; yellow #ecd98f/#4a3800, blue #b8d0f0/#1a2f55
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify right
set -g status-style "bg=#20242c,fg=#d3dae3"
# number of panes without the floating notification toast (those carry @toast_src, see notify.sh): the pane counter and the
# one-pane / two-pane checks use it, so a toast open for 5 s does not change "1/1" to "1/2"
set -g @tiled "#{n:#{P:#{?@toast_src,,x}}}"
set -g status-left-length 90
set -g status-right-length 230

# OS icon + user, worked out once at load (Nerd Font glyphs), shown leftmost on the darkest colour.
run-shell 'id=$(. /etc/os-release 2>/dev/null && echo "$ID"); [ "$(uname)" = Darwin ] && id=macos; case "$id" in ubuntu) i= ;; arch) i= ;; debian) i= ;; fedora) i= ;; nixos) i= ;; manjaro) i= ;; macos) i= ;; *) i= ;; esac; tmux set -g @os_icon "$i"; tmux set -g @os_user "$(id -un)"'

# left: bell (darkest; click target of the notification list) > OS icon + user (dark teal, same as the session on the right) > mode label (NORMAL / PREFIX / COPY / ZOOM, mode coloured) > pane n/total > what the
# pane is running (nvim, zsh, ...). The window tabs sit on the right (status-justify right), next to the time.
set -g status-left "#[range=user|bell]#{?@notif_n,#[fg=#f0b060#,bg=#14171c#,bold]  #{@notif_n} #[nobold],#[fg=#6b7380#,bg=#14171c]  }#[norange]#[fg=#14171c,bg=#2b72c5]#[fg=#f6faff,bg=#2b72c5,bold] #{@os_icon} #{@os_user} #[fg=#2b72c5,bg=#{?@dialog,#5b2d91,#{?#{==:#{client_key_table},resize},#f0c4a0,#{?@popup,#ecd98f,#{?pane_in_mode,#b8d0f0,#{?window_zoomed_flag,#d4c4ec,#{?#{==:#{@exp_kind},col},#a8dcb8,#{?#{==:#{@exp_kind},row},#f0b4c4,#4b8cd8}}}}}}}]#[fg=#{?@dialog,#f3eaff,#{?#{==:#{client_key_table},resize},#4a2a00,#{?@popup,#4a3800,#{?pane_in_mode,#1a2f55,#{?window_zoomed_flag,#3a2a5a,#{?#{==:#{@exp_kind},col},#123a22,#{?#{==:#{@exp_kind},row},#4a1428,#11151c}}}}}}},bg=#{?@dialog,#5b2d91,#{?#{==:#{client_key_table},resize},#f0c4a0,#{?@popup,#ecd98f,#{?pane_in_mode,#b8d0f0,#{?window_zoomed_flag,#d4c4ec,#{?#{==:#{@exp_kind},col},#a8dcb8,#{?#{==:#{@exp_kind},row},#f0b4c4,#4b8cd8}}}}}}},nobold] #{?@dialog,COMMAND,#{?#{==:#{client_key_table},resize},RESIZE,#{?@popup,PREFIX,#{?pane_in_mode,COPY,#{?window_zoomed_flag,ZOOM,#{?#{==:#{@exp_kind},col},COLUMN,#{?#{==:#{@exp_kind},row},ROW,NORMAL}}}}}}} #[fg=#{?@dialog,#5b2d91,#{?#{==:#{client_key_table},resize},#f0c4a0,#{?@popup,#ecd98f,#{?pane_in_mode,#b8d0f0,#{?window_zoomed_flag,#d4c4ec,#{?#{==:#{@exp_kind},col},#a8dcb8,#{?#{==:#{@exp_kind},row},#f0b4c4,#4b8cd8}}}}}}},bg=#3c4252]#[fg=#d3dae3,bg=#3c4252]  #P/#{E:@tiled} #[fg=#3c4252,bg=#2d323d]#[fg=#d3dae3,bg=#2d323d,bold] #{pane_current_command} #[fg=#2d323d,bg=#20242c,nobold] "

# windows: inactive plain, current = a-coloured block with a zoom marker
set -g window-status-separator ""
# @claude is set on a window by ~/.tmux/notify.sh: done = green dot, wait (needs you) = orange, fail = red, bell = blue
set -g window-status-format "#[fg=#afb5bd,bg=#20242c] #I #W#{?window_zoomed_flag, Z,}#{?#{@claude},#[fg=#{?#{==:#{@claude},done},#4ad85e,#{?#{==:#{@claude},wait},#f0a050,#{?#{==:#{@claude},fail},#f8467a,#69a6ed}}}#,bold] ●,} "
set -g window-status-current-format "#[fg=#4b8cd8,bg=#20242c]#[fg=#11151c,bg=#4b8cd8,bold] #I #W#{?window_zoomed_flag, Z,} #[fg=#4b8cd8,bg=#20242c,nobold]"

# right: window tabs | time | session (dark teal #2b72c5). The bell is at the left, in front of the user.
set -g @right "#[fg=#{?@dialog,#5b2d91,#{?#{==:#{client_key_table},resize},#f0c4a0,#{?@popup,#ecd98f,#{?pane_in_mode,#b8d0f0,#{?window_zoomed_flag,#d4c4ec,#{?#{==:#{@exp_kind},col},#a8dcb8,#{?#{==:#{@exp_kind},row},#f0b4c4,#4b8cd8}}}}}}},bg=#20242c]#[fg=#{?@dialog,#f3eaff,#{?#{==:#{client_key_table},resize},#4a2a00,#{?@popup,#4a3800,#{?pane_in_mode,#1a2f55,#{?window_zoomed_flag,#3a2a5a,#{?#{==:#{@exp_kind},col},#123a22,#{?#{==:#{@exp_kind},row},#4a1428,#11151c}}}}}}},bg=#{?@dialog,#5b2d91,#{?#{==:#{client_key_table},resize},#f0c4a0,#{?@popup,#ecd98f,#{?pane_in_mode,#b8d0f0,#{?window_zoomed_flag,#d4c4ec,#{?#{==:#{@exp_kind},col},#a8dcb8,#{?#{==:#{@exp_kind},row},#f0b4c4,#4b8cd8}}}}}}}] 󰥔 %d %b %H:%M #[fg=#2b72c5,bg=#{?@dialog,#5b2d91,#{?#{==:#{client_key_table},resize},#f0c4a0,#{?@popup,#ecd98f,#{?pane_in_mode,#b8d0f0,#{?window_zoomed_flag,#d4c4ec,#{?#{==:#{@exp_kind},col},#a8dcb8,#{?#{==:#{@exp_kind},row},#f0b4c4,#4b8cd8}}}}}}}]#[fg=#f6faff,bg=#2b72c5,bold]  #S "
set -g status-right "#{E:@right}"

# pane borders + copy-mode selection + messages
# active pane tracking: heavy borders, the active pane's in blue (backgrounds untouched)
set -g pane-border-lines heavy
# Divider: only the half next to the active pane is dark (tmux's "colour" indicator). There used to be a small arrow on the divider
# of two-pane windows ("both") pointing at the active pane; the numbers on the borders say which pane is active now, so it is gone.
# A window can still carry the old per-window "both" from a previous load: drop those so every window follows the global value.
run-shell 'for w in $(tmux list-windows -a -F "#{window_id}"); do tmux set -w -t "$w" -u pane-border-indicators; done'
set -g pane-border-indicators colour
set -g pane-active-border-style "fg=#4b8cd8,bold"
set -g mode-style "bg=#2b72c5,fg=#ffffff"
set -g message-style "bg=#2b72c5,fg=#ffffff"
set -g message-command-style "bg=#2b72c5,fg=#ffffff"

# Pane numbers: every pane has a label in the middle of its top border, " 1 ", the same number prefix + 1..9 and prefix + q use (dark block
# on the active pane, light on the others). A pane with another pane above it shows the label on the divider that is
# already there, and the top row of panes uses the row the old "box" edge used, so no space is lost: the status is one row.
# prefix + b turns the labels (and that top line) on / off for the current window. Floating notification panes
# (@toast_src, see notify.sh) have no label.
set -g status on
set -gu status-format[1]
# a session can still carry its own old "status 2" (the old box toggle set it per session), which would leave an empty second
# status row: drop such overrides so every session follows the global
run-shell 'for s in $(tmux list-sessions -F "#{session_name}"); do tmux set -t "$s" -u status; done'
set -g pane-border-status top
set -g pane-border-format "#{?@toast_src,,#[align=centre]#{?pane_active,#[fg=#11151c#,bg=#4b8cd8#,bold],#[fg=#afb5bd#,bg=#323743]} #{pane_index} #[default]}"
bind b if -F '#{==:#{pane-border-status},off}' 'setw pane-border-status top' 'setw pane-border-status off'
set-hook -gu after-select-pane
set-hook -gu window-layout-changed
set-hook -gu after-new-window
set-hook -gu after-new-session
set-hook -gu after-select-window
set-hook -gu client-focus-in
set-hook -gu alert-bell
set-hook -gu pane-exited
set-hook -gu after-kill-pane
set -g pane-border-style "fg=#3c4252"

# Claude notifications: looking at a window (selecting it, or the terminal regaining focus) clears its dot.
set-hook -ag after-select-window 'set -wu @claude'
set-hook -g client-focus-in 'set -wu @claude'

# A bell (\a) in a window you are not looking at gives it a blue dot and a desktop notification (nvim, builds, ...).
set -g monitor-bell on
set -g bell-action other
set-hook -g pane-exited 'run-shell -b "~/.tmux/expand.py gc #{window_id}"'
set-hook -g after-kill-pane 'run-shell -b "~/.tmux/expand.py gc #{window_id}"'
set-hook -g alert-bell 'run-shell -b "TMUX_PANE=#{pane_id} ~/.tmux/notify.sh bell"'

# Notification list: the bell in the status bar (count = unread) and Alt-e g open a dropdown under the status bar, newest
# first (~/.tmux/notifications.sh): Enter jumps to the window, Ctrl-x removes one, Ctrl-l clears all, Esc closes.
# Clicking the bell does the same; any other click on the status line keeps its normal job (select the window).
bind g display-popup -E -b rounded -x 0 -y S -w 72 -h 18 -T " notifications " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/notifications.sh"
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},bell}' {
  display-popup -E -b rounded -x 0 -y S -w 72 -h 18 -T " notifications " -s "bg=#20242c,fg=#d3dae3" -S "fg=#4b8cd8" "~/.tmux/notifications.sh"
} {
  switch-client -t =
}

# Visiting a window (or coming back to the terminal on it) marks its notifications as read, so the bell only counts
# what you have not looked at yet.
set-hook -ag after-select-window 'run-shell -b "~/.tmux/notif-read.sh #{window_id}"'
set-hook -ag client-focus-in 'run-shell -b "~/.tmux/notif-read.sh #{window_id}"'
