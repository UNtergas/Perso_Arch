# ~/.tmux.conf  (repo copy: Perso_Arch/new_tmux/tmux.conf)
# Alt-e: unused by nvim, kvim, zsh, Alacritty and niri. Not Alt-k (nvim half page up), not C-Space (also sent by Ctrl+`)
# Alt-e opens a key dropdown under the status bar (~/.tmux/which-key.sh, copy of new_tmux/which-key.sh). It reads one
# key and passes it to the prefix table, so every "prefix + key" below is Alt-e then the key. The real tmux prefix is
# off (None) so that Alt-e is an ordinary key that can open the dropdown.
set -g prefix None
unbind C-b
unbind C-Space
unbind M-Space
# The popup is 36 rows; -h does not take a format, so a short terminal (under 40 rows) gets a 90% popup instead.
bind -n M-e if -F '#{e|<:#{client_height},40}' {
  display-popup -E -b rounded -x "#{e|-:#{client_width},62}" -y S -w 60 -s "bg=#eef1f1,fg=#14201f" -S "fg=#4a6a6a" -h 90% "~/.tmux/which-key.sh '#{client_name}' '#{pane_id}'"
} {
  display-popup -E -b rounded -x "#{e|-:#{client_width},62}" -y S -w 60 -s "bg=#eef1f1,fg=#14201f" -S "fg=#4a6a6a" -h 36 "~/.tmux/which-key.sh '#{client_name}' '#{pane_id}'"
}

set -g mouse on
set -g escape-time 0              # no Esc lag in nvim
set -g focus-events on            # nvim autoread / FocusGained
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"   # truecolor for the nvim theme
setw -g mode-keys vi

bind r source-file ~/.tmux.conf \; display "reloaded"

# move: prefix + hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# resize: prefix + HJKL (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# prefix + arrows: MOVE the pane (swap places with the neighbour in that direction), focus goes with it
bind -r Left swap-pane -t '{left-of}'  \; select-pane -t '{left-of}'
bind -r Right swap-pane -t '{right-of}' \; select-pane -t '{right-of}'
bind -r Up swap-pane -t '{up-of}'    \; select-pane -t '{up-of}'
bind -r Down swap-pane -t '{down-of}'  \; select-pane -t '{down-of}'

# prefix + [ / ]: like niri's consume-or-expel-window-left / right (Mod+[ and Mod+])
#   pane alone in its column -> consumed into the neighbouring column (stacked below its pane)
#   pane in a stack          -> expelled into its own full-height column at the left / right edge
# Other columns keep their widths. Logic is in ~/.tmux/pane-col.sh (copy of new_tmux/pane-col.sh).
# col1 | col2, [ on col2 -> col1 over col2, [ again -> col2 | col1.  Copy mode moved to v for this.
bind v copy-mode
# copy mode like vim: v starts the selection (V line, C-v block), y yanks to the system clipboard and leaves, Esc leaves
# (wl-copy on Wayland, xclip on X11)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -selection clipboard"
bind -T copy-mode-vi Escape send -X cancel
bind [ run-shell "~/.tmux/pane-col.sh left #{pane_id}"
bind ] run-shell "~/.tmux/pane-col.sh right #{pane_id}"

# splits like nvim: \ = side by side, - = stacked (new pane keeps cwd)
bind \\ split-window -h -c "#{pane_current_path}"
bind -   split-window -v -c "#{pane_current_path}"
bind x kill-pane

# detach moved to Q so lowercase d can be the preset
bind Q detach-client

# PRESETS: with a single pane in the window, they turn THIS window into the layout (the pane stays, 2 more are added);
# with more than one pane they open a new window with the layout instead (a window you arranged is not touched).
# prefix + a -> 3 terminals: one 65% on the left, 2 stacked on the right (35%)
bind a if -F '#{==:#{window_panes},1}' {
  split-window -h -l 35% -c "#{pane_current_path}"
  split-window -v -c "#{pane_current_path}"
  select-pane -L
} {
  new-window -n side -c "#{pane_current_path}"
  split-window -h -l 35% -c "#{pane_current_path}"
  split-window -v -c "#{pane_current_path}"
  select-pane -L
}

# prefix + d -> 3 terminals: one on top (70% of the height), 2 side by side below (30%)
bind d if -F '#{==:#{window_panes},1}' {
  split-window -v -l 30% -c "#{pane_current_path}"
  split-window -h -c "#{pane_current_path}"
  select-pane -U
} {
  new-window -n stacked -c "#{pane_current_path}"
  split-window -v -l 30% -c "#{pane_current_path}"
  split-window -h -c "#{pane_current_path}"
  select-pane -U
}

# Space is unbound (no flip, no stock layout cycling). main-pane-width is the big slot of m (focus left) and of the
# Alt-4 layout, main-pane-height the big slot of n (focus top) and of the Alt-3 layout
set -g main-pane-width 65%
set -g main-pane-height 70%
unbind Space

# prefix + m: focus mode. The focused pane goes to the big 65% slot on the left, all the others
# stack on the right (35%). Press again to put every pane back where it was (layout + positions).
# If the pane count changed in between, the saved layout is stale, so it just applies focus mode again.
bind m if -F '#{&&:#{@main_saved},#{==:#{@main_n},#{window_panes}}}' \
  'run-shell "tmux swap-pane -d -s :.1 -t :.#{@main_idx} ; tmux select-layout \"#{@main_saved}\" ; tmux set -wu @main_saved"' \
  'run-shell "tmux set -w @main_saved \"#{window_layout}\" ; tmux set -w @main_n #{window_panes} ; tmux set -w @main_idx #{pane_index} ; tmux swap-pane -d -s #{pane_id} -t :.1 ; tmux select-layout main-vertical"'

# prefix + n: focus mode, top version. The focused pane goes to the top (70% of the height), all the others sit side by
# side below it (30%). Press again to put every pane back where it was. Same logic as m, with its own saved layout.
bind n if -F '#{&&:#{@top_saved},#{==:#{@top_n},#{window_panes}}}' \
  'run-shell "tmux swap-pane -d -s :.1 -t :.#{@top_idx} ; tmux select-layout \"#{@top_saved}\" ; tmux set -wu @top_saved"' \
  'run-shell "tmux set -w @top_saved \"#{window_layout}\" ; tmux set -w @top_n #{window_panes} ; tmux set -w @top_idx #{pane_index} ; tmux swap-pane -d -s #{pane_id} -t :.1 ; tmux select-layout main-horizontal"'

# zoom the pane to the whole window and back (layout restored exactly)
bind z resize-pane -Z

# o / p = previous / next window, N = new window
bind o previous-window
bind p next-window
bind N new-window -c "#{pane_current_path}"
unbind Z

# grow the current pane to fill its COLUMN, press again to restore the old split
bind c if -F '#{@saved_h}' \
  'run-shell "tmux resize-pane -t #{pane_id} -y #{@saved_h} ; tmux set -p -t #{pane_id} -u @saved_h"' \
  'run-shell "tmux set -p -t #{pane_id} @saved_h #{pane_height} ; tmux resize-pane -t #{pane_id} -y 95%"'

# C: the same for the ROW. Grow the current pane to fill its row (95% of the width), press again to restore the old split
bind C if -F '#{@saved_w}' \
  'run-shell "tmux resize-pane -t #{pane_id} -x #{@saved_w} ; tmux set -p -t #{pane_id} -u @saved_w"' \
  'run-shell "tmux set -p -t #{pane_id} @saved_w #{pane_width} ; tmux resize-pane -t #{pane_id} -x 95%"'

# --- statusline: mirrors the nvim lualine (koda-glade): light teal-grey fade, powerline arrows, no plugin needed.
# The mode label (NORMAL / PREFIX / COPY / ZOOM) changes colour like lualine's mode: grey = normal,
# yellow = prefix pressed, blue = copy mode. The session name is on the far right (see @right).
# Colours: a #8da1a1, b #adbcbc, c #cbd6d6, text #14201f; yellow #ecd98f/#4a3800, blue #b8d0f0/#1a2f55
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify right
set -g status-style "bg=#cbd6d6,fg=#14201f"
set -g status-left-length 90
set -g status-right-length 230

# OS icon + user, worked out once at load (Nerd Font glyphs), shown leftmost on the darkest colour.
run-shell 'id=$(. /etc/os-release 2>/dev/null && echo "$ID"); [ "$(uname)" = Darwin ] && id=macos; case "$id" in ubuntu) i= ;; arch) i= ;; debian) i= ;; fedora) i= ;; nixos) i= ;; manjaro) i= ;; macos) i= ;; *) i= ;; esac; tmux set -g @os_icon "$i"; tmux set -g @os_user "$(id -un)"'

# left: OS icon + user (darkest) > mode label (NORMAL / PREFIX / COPY / ZOOM, mode coloured) > pane n/total > what the
# pane is running (nvim, zsh, ...). The window tabs sit on the right (status-justify right), next to the time.
set -g status-left "#[fg=#cbd6d6,bg=#14201f,bold] #{@os_icon} #{@os_user} #[fg=#14201f,bg=#{?@popup,#ecd98f,#{?pane_in_mode,#b8d0f0,#adbcbc}}]#[fg=#{?@popup,#4a3800,#{?pane_in_mode,#1a2f55,#1c2828}},bg=#{?@popup,#ecd98f,#{?pane_in_mode,#b8d0f0,#adbcbc}},nobold] #{?@popup,PREFIX,#{?pane_in_mode,COPY,#{?window_zoomed_flag,ZOOM,NORMAL}}} #[fg=#{?@popup,#ecd98f,#{?pane_in_mode,#b8d0f0,#adbcbc}},bg=#b8c7c7]#[fg=#1c2828,bg=#b8c7c7]  #P/#{window_panes} #[fg=#b8c7c7,bg=#c3d0d0]#[fg=#1c2828,bg=#c3d0d0,bold] #{pane_current_command} #[fg=#c3d0d0,bg=#cbd6d6,nobold] "

# windows: inactive plain, current = a-coloured block with a zoom marker
set -g window-status-separator ""
set -g window-status-format "#[fg=#4a5a5a,bg=#cbd6d6] #I #W#{?window_zoomed_flag, Z,} "
set -g window-status-current-format "#[fg=#8da1a1,bg=#cbd6d6]#[fg=#14201f,bg=#8da1a1,bold] #I #W#{?window_zoomed_flag, Z,} #[fg=#8da1a1,bg=#cbd6d6,nobold]"

# right: window tabs | time | session (darkest,
# same colour as the user section; hidden while the prefix hint is shown)
set -g @right "#[fg=#a3b5b5,bg=#cbd6d6]#[fg=#1c2828,bg=#a3b5b5] %d %b %H:%M #[fg=#14201f,bg=#a3b5b5]#[fg=#cbd6d6,bg=#14201f,bold]  Session #S "
set -g status-right "#{E:@right}"

# pane borders + copy-mode selection + messages
# active pane tracking: heavy borders, the active pane's in blue (backgrounds untouched)
set -g pane-border-lines heavy
set -g pane-active-border-style "fg=#4a6a6a,bold"
set -g mode-style "bg=#b8d0f0,fg=#1a2f55"
set -g message-style "bg=#b8d0f0,fg=#1a2f55"
set -g message-command-style "bg=#b8d0f0,fg=#1a2f55"

# box (on by default, prefix + b toggles it per session): the status is 2 rows: row 1 is the normal clickable status line, row 2 is the top edge of the
# active pane (dark over it, light over the others, a junction at every divider). Drawn by ~/.tmux/box.sh edge into the
# window option @topedge (copy of new_tmux/box.sh), refreshed on pane select, layout change and new window.
bind b run-shell "~/.tmux/box.sh toggle"
set -g @box 1
set -g status 2
set-hook -gu after-select-pane
set-hook -gu window-layout-changed
set-hook -gu after-new-window
set-hook -gu after-new-session
set-hook -gu after-select-window
set -g pane-border-style "fg=#dde5e5"
set-hook -g after-select-pane 'run-shell -b "~/.tmux/box.sh edge #{window_id}"'
set-hook -g window-layout-changed 'run-shell -b "~/.tmux/box.sh edge #{window_id}"'
set-hook -g after-new-window 'run-shell -b "~/.tmux/box.sh edge #{window_id}"'
set-hook -g after-new-session 'run-shell -b "~/.tmux/box.sh edge #{window_id}"'
set-hook -g after-select-window 'run-shell -b "~/.tmux/box.sh edge #{window_id}"'
set -g status-format[1] "#[bg=terminal]#{@topedge}"
